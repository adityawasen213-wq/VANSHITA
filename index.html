<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For You 💗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#792b43}
body{background:#f7c8d4}.page{display:none;min-height:100dvh;background:#f6c5d1;overflow:hidden}.page.on{display:flex;align-items:center;justify-content:center}
.card{width:min(900px,96vw);min-height:min(610px,94dvh);position:relative;text-align:center;padding:34px;border-radius:24px;background:radial-gradient(circle at center,#f9e6ea 0 18%,#f6d8df 18.5% 36%,#f9e6ea 36.5% 54%,#f5cbd5 54.5%);box-shadow:0 18px 50px #8e345124}
h1{font-family:"Comic Sans MS",cursive;color:#a42d4e;font-size:38px;margin:8px 0 18px}.sub{font-size:20px;font-weight:700;margin:8px 0 16px}
.front{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;max-width:720px;margin:auto}.sticker{width:270px;height:270px;object-fit:contain;image-rendering:auto;margin:auto;filter:drop-shadow(0 12px 15px #8430441c)}
.keybox{background:#f4aebf;padding:20px;border-radius:20px}.pin{display:flex;justify-content:center;gap:9px;margin-bottom:13px}.pin i{width:43px;height:49px;background:#fff6f8;border:2px solid #e69bad;border-radius:8px;font-style:normal;display:grid;place-items:center;font-size:25px}
.keys{display:grid;grid-template-columns:repeat(3,58px);gap:9px;justify-content:center}.key{width:58px;height:49px;border-radius:50%;border:1px solid #d47f94;background:#fff0f4;font-weight:800;font-size:18px;color:#7d3045}
.hint{margin-top:12px;font-weight:800;color:#aa3657}.row{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.btn{border:0;border-radius:999px;background:#b93a58;color:#fff;padding:13px 25px;font-size:18px;font-weight:900;cursor:pointer}.ghost{background:#fff1f4;color:#a52e4d;border:2px solid #d8899c}
.float{animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}.wrong{animation:shake 1s infinite}@keyframes shake{25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
.plan{display:block!important;overflow-y:auto;padding:20px}.planwrap{max-width:760px;margin:auto}.box{background:#fff8fa;padding:18px;border-radius:22px;text-align:left}label{display:block;font-weight:800;margin:11px 0 6px}input,select{width:100%;padding:12px;border:1px solid #ddb1bd;border-radius:12px;font-size:16px}iframe{width:100%;height:230px;border:0;border-radius:15px;margin:13px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#result,#share{display:none}#result{margin-top:12px;background:#ffeaf0;padding:12px;border-radius:12px;line-height:1.55}
@media(max-width:650px){.card{min-height:100dvh;border-radius:0;padding:24px 14px}.front{grid-template-columns:1fr;gap:5px}.sticker{width:220px;height:220px}h1{font-size:31px}.keybox{max-width:320px;margin:auto}.two{grid-template-columns:1fr}}
</style></head><body>

<section class="page on" id="p1"><div class="card"><h1>Enter a passcode</h1><div class="front">
<img class="sticker float" src="https://cdn2.cdnstep.com/l3XP16i4jNpGBntzrSqF/37-1.thumb128.png" alt="Bubu and Dudu">
<div class="keybox"><div class="pin" id="pin"><i></i><i></i><i></i><i></i></div><div class="keys" id="keys">
<button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key" data-x="b">⌫</button><button class="key">0</button><button class="key" data-x="o">✓</button></div><div class="hint">Hint: dono ki birthday dates 💗</div></div></div></div></section>

<section class="page" id="wrong"><div class="card"><h1>WRONG PASSCODE!</h1><img class="sticker wrong" src="https://cdn2.cdnstep.com/l3XP16i4jNpGBntzrSqF/2-4.thumb128.png"><div class="sub">Try again 🥺</div><button class="btn" onclick="show('p1')">TRY AGAIN</button></div></section>

<section class="page" id="special"><div class="card"><h1>I made something special for u 💗</h1><img class="sticker float" src="https://cdn2.cdnstep.com/l3XP16i4jNpGBntzrSqF/29-1.thumb128.png"><div class="sub">Do u wanna see it?</div><div class="row"><button class="btn" onclick="show('proposal')">YES</button><button class="btn ghost" onclick="show('why')">NO</button></div></div></section>

<section class="page" id="why"><div class="card"><h1>Why did u click NO!?</h1><img class="sticker wrong" src="https://cdn2.cdnstep.com/l3XP16i4jNpGBntzrSqF/26-1.thumb128.png"><div class="sub">Aise kaise 😭</div><button class="btn" onclick="show('special')">TRY AGAIN</button></div></section>

<section class="page" id="proposal"><div class="card"><h1>Will you be mine? 💍❤️</h1><img class="sticker float" src="https://cdn2.cdnstep.com/l3XP16i4jNpGBntzrSqF/37-1.thumb128.png"><div class="row"><button class="btn" onclick="show('plan')">YES ❤️</button><button class="btn ghost" id="no">NO</button></div></div></section>

<section class="page plan" id="plan"><div class="planwrap"><h1>Our Date Plan in Ratlam ❤️</h1><div style="text-align:center;font-weight:800;margin:-6px 0 14px;color:#a52e4d">⭐ Recommended meeting point: Government Medical College, Ratlam</div><div class="box">
<label>🚗 Pickup Point</label><input id="pickup" placeholder="Exact pickup point / landmark">
<label>📍 Place</label><select id="place">
<option value="">Choose...</option>
<option value="Government Medical College, Ratlam">⭐ Recommended: Government Medical College, Ratlam</option><optgroup label="☕ Cafés"><option>7Hills Restaurant &amp; Café, Ratlam</option><option>Chai Sutta Bar, Ratlam</option><option>Indiana The Cafe, Ratlam</option><option>Sadda Adda Cafe, Ratlam</option><option>Jalsara, Ratlam</option><option>Checkers Cafe, Ratlam</option><option>The Chai Shala Cafe and Party Zone, Ratlam</option><option>Chahapani, Ratlam</option><option>Coffee Calling, Ratlam</option><option>Classic Cafe, Ratlam</option></optgroup><optgroup label="🛕 Mandir"><option>Kalika Mata Temple, Ratlam</option><option>Mahalakshmi Temple, Manak Chowk, Ratlam</option><option>Shri Virupaksh Mahadev Temple, Bilpank</option><option>Bibrod Tirth, Ratlam</option><option>Shri Nageshwar Parshwanath Tirth, Ratlam</option><option>Shri Mehandi Kui Balaji Mandir, Ratlam</option><option>Ranjit Hanuman Mandir, Ratlam</option><option>Kaal Bhairav Ji Temple, Ratlam</option></optgroup><option>Gulab Chakkar, Ratlam</option><option>Dholawad Dam, Ratlam</option></select>
<iframe id="map" src="https://www.google.com/maps?q=Government%20Medical%20College%2C%20Ratlam%2C%20Madhya%20Pradesh&output=embed"></iframe>
<div class="two"><div><label>📅 Date</label><input id="date" type="date"></div><div><label>🕒 Time</label><input id="time" type="time"></div></div>
<button class="btn" id="confirm" style="width:100%;margin-top:13px">Confirm Date Plan ❤️</button><div id="result"></div><button class="btn" id="share" style="width:100%;margin-top:10px">Send on WhatsApp ❤️</button></div></div></section>

<script>
const ps=[...document.querySelectorAll('.page')];function show(id){ps.forEach(p=>p.classList.toggle('on',p.id===id));scrollTo(0,0)}
let code='';const dots=[...document.querySelectorAll('#pin i')];function draw(){dots.forEach((d,i)=>d.textContent=i<code.length?'•':'')}
function check(){if(code==='2303')show('special');else show('wrong');code='';draw()}
keys.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.x==='b')code=code.slice(0,-1);else if(b.dataset.x==='o')return check();else if(/^\d$/.test(b.textContent)&&code.length<4)code+=b.textContent;draw();if(code.length===4)setTimeout(check,150)}
let n=0;no.onclick=()=>{n++;no.style.transform=`translate(${(Math.random()-.5)*220}px,${(Math.random()-.5)*130}px)`;document.querySelector('#proposal .btn').style.transform=`scale(${Math.min(1+n*.18,1.8)})`}
place.onchange=()=>map.src='https://www.google.com/maps?q='+encodeURIComponent((place.value||'Ratlam')+', Madhya Pradesh')+'&output=embed';
let now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;date.min=today;date.value=today;let msg='';
confirm.onclick=()=>{let pu=pickup.value.trim(),pl=place.value,d=date.value,t=time.value;if(!pu||!pl||!d||!t){result.style.display='block';result.textContent='Pickup, place, date aur time sab choose karo 🥺';share.style.display='none';return}msg=`❤️ OUR DATE PLAN ❤️\n🚗 Pickup: ${pu}\n📍 Place: ${pl}\n📅 Date: ${d}\n🕒 Time: ${t}`;result.style.display='block';result.innerHTML='<b>Plan Confirmed ❤️</b><br>'+msg.replaceAll('\n','<br>');share.style.display='block'}
share.onclick=()=>window.open('https://wa.me/916265846172?text='+encodeURIComponent(msg),'_blank');
</script></body></html>
