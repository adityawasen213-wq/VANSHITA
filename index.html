function show(n){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById('p'+n).classList.add('on')}
let code=''; const dotEls=[...document.querySelectorAll('#dots i')];
function paint(){dotEls.forEach((x,i)=>x.textContent=i<code.length?'♥':'')}
document.getElementById('digits').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;if(v==='noop')return;if(v==='back'){code=code.slice(0,-1);paint();return}code+=b.textContent.trim();paint();if(code.length===4){setTimeout(()=>{if(code==='2303'){show(3);try{document.getElementById('bg').play()}catch(e){}}else show(2);code='';paint()},120)}};
retry.onclick=()=>show(1); sy.onclick=()=>show(5); sn.onclick=()=>show(4); wr.onclick=()=>show(3);
let grow=1; my.onclick=()=>show(6); mn.onclick=()=>{grow=Math.min(grow+.2,2.2);my.style.transform=`scale(${grow})`};
let hg=1; hy.onclick=()=>show(7); hn.onclick=()=>{hg=Math.min(hg+.18,2);hy.style.transform=`scale(${hg})`};
dp.onclick=()=>show(8);pk.onclick=()=>show(9);
const d=document.getElementById('date'),t=document.getElementById('time');let tm=new Date();tm.setDate(tm.getDate()+1);d.value=tm.toISOString().slice(0,10);t.value='17:30';
mapClick.onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place.value),'_blank');
let message='';
confirmPlan.onclick=()=>{message=`❤️ OUR DATE PLAN ❤️\nPickup Point: ${pickup.value}\nPlace: ${place.value}\nDate: ${d.value}\nTime: ${t.value}`;summaryOverlay.innerHTML=`<b>Pickup Point :</b><br>${pickup.value}<br><br><b>Place :</b><br>${place.value}<br><br><b>Date :</b><br>${d.value}<br><br><b>Time :</b><br>${t.value}`;show(10)};
wa.onclick=()=>window.open('https://wa.me/916265846172?text='+encodeURIComponent(message),'_blank');
</script></body></html>
