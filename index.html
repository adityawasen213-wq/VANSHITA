<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For You ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#ffd4df;color:#6b2940}
body{overflow-x:hidden}
.page{display:none;min-height:100dvh;padding:0;background:linear-gradient(180deg,#f59db8 0%,#ffc2d2 45%,#ffe3e9 100%)}
.page.on{display:flex;align-items:center;justify-content:center}
.phone{width:min(430px,100vw);min-height:100dvh;padding:22px 18px 28px;text-align:center;position:relative;overflow:hidden}
.heart{position:absolute;opacity:.45;animation:float 3.8s ease-in-out infinite}
.h1{left:7%;top:8%} .h2{right:9%;top:15%;animation-delay:.8s} .h3{left:8%;bottom:9%;animation-delay:1.8s}
@keyframes float{50%{transform:translateY(-9px)}}
h1{font-family:Georgia,serif;color:#a4254b;font-size:34px;margin:8px 0 8px}
.sub{font-size:17px;line-height:1.45}
.sticker{display:block;width:min(300px,82vw);max-height:330px;object-fit:contain;margin:12px auto 14px;filter:drop-shadow(0 12px 20px #8c29441c)}
.sticker.big{width:min(330px,88vw);max-height:360px}
.pin{display:flex;justify-content:center;gap:9px;margin:8px 0 12px}
.pin span{width:42px;height:48px;background:#fff8fb;border:2px solid #f0b9c8;border-radius:10px;display:grid;place-items:center;font-size:25px}
.keypad{display:grid;grid-template-columns:repeat(3,66px);gap:9px;justify-content:center;margin:8px auto}
.key{width:66px;height:54px;border-radius:50%;border:1px solid #eaa9bb;background:#fff3f7;color:#8e2d4b;font-size:20px;font-weight:800}
.hint{font-size:14px;font-weight:800;color:#a82d50;margin-top:9px}
.btn{border:0;border-radius:999px;background:#d33262;color:white;font-size:17px;font-weight:800;padding:14px 26px;cursor:pointer;box-shadow:0 10px 24px #a5294b25}
.ghost{background:#fff2f6;color:#a42b4c;border:1px solid #e8a9ba;box-shadow:none}
.row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.music{position:fixed;right:14px;top:14px;z-index:40;width:52px;height:52px;border-radius:50%;border:0;background:#fff7fa;box-shadow:0 8px 22px #0002;font-size:22px}
.planPage{align-items:flex-start!important;overflow-y:auto}
.plan{width:min(760px,96vw);padding:18px 0 32px}
.planBox{background:#fff8fb;border:1px solid #efc4d1;border-radius:24px;padding:18px;text-align:left}
label{display:block;font-weight:800;margin:12px 0 7px}
input,select{width:100%;padding:13px 14px;border:1px solid #e4b5c2;border-radius:13px;font-size:16px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mapbox{overflow:hidden;border-radius:16px;border:1px solid #ead0d7;margin:14px 0}
iframe{width:100%;height:240px;border:0;display:block}
.result{display:none;background:#fff0f4;border-radius:14px;padding:14px;margin-top:12px;line-height:1.55}
#share{display:none;width:100%;margin-top:10px}
@media(max-width:560px){h1{font-size:30px}.sticker{max-height:285px}.keypad{grid-template-columns:repeat(3,60px)}.key{width:60px;height:50px}.grid2{grid-template-columns:1fr}iframe{height:210px}}
</style>
</head>
<body>
<button class="music" id="music">🎵</button>

<section class="page on" id="pass">
<div class="phone">
<span class="heart h1">💗</span><span class="heart h2">💗</span><span class="heart h3">💗</span>
<h1>Enter a passcode</h1>
<img class="sticker big" src="https://e1.pxfuel.com/desktop-wallpaper/445/33/desktop-wallpaper-panda-bear-bubu-dudu-sticker-by-dev-dudu-bubu.jpg" alt="Real Bubu Dudu">
<div class="pin" id="pin"><span></span><span></span><span></span><span></span></div>
<div class="keypad" id="keys">
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key" data-a="back">⌫</button><button class="key">0</button><button class="key" data-a="ok">✓</button>
</div>
<div class="hint">Hint: dono ki birthday dates ❤️</div>
</div>
</section>

<section class="page" id="wrong">
<div class="phone">
<h1>WRONG PASSCODE!</h1>
<img class="sticker big" src="https://media.tenor.com/1pwDWkS58hEAAAAe/bubu-dudu-bubu-pushing-dudu.png" alt="Real Bubu Dudu pushing">
<div class="sub">Oops 😭</div>
<button class="btn" id="retry" style="margin-top:18px">TRY AGAIN</button>
</div>
</section>

<section class="page" id="special">
<div class="phone">
<h1>I made something special for u ❤️</h1>
<img class="sticker big" src="https://c.tenor.com/8trqa66_h6MAAAAC/dudu-bubu-bear-and-panda.gif" alt="Real Bubu Dudu hug">
<div class="sub">Do u wanna see it?</div>
<div class="row" style="margin-top:20px"><button class="btn" id="spyes">YES ❤️</button><button class="btn ghost" id="spno">NO 🙈</button></div>
</div>
</section>

<section class="page" id="whyno">
<div class="phone">
<h1>Why did u click NO!?</h1>
<img class="sticker big" src="https://media.tenor.com/YhS2oGAydN8AAAAi/bubu-dudu-sseeyall.gif" alt="Real Bubu Dudu crying">
<div class="sub" id="whytext">Aise kaise 😭</div>
<button class="btn" id="whyretry" style="margin-top:18px">TRY AGAIN</button>
</div>
</section>

<section class="page" id="proposal">
<div class="phone">
<h1>Will you be mine? 💍❤️</h1>
<img class="sticker big" src="https://c.tenor.com/8trqa66_h6MAAAAC/dudu-bubu-bear-and-panda.gif" alt="Real Bubu Dudu couple">
<div class="row" style="margin-top:20px"><button class="btn" id="pyes">YES ❤️</button><button class="btn ghost" id="pno">NO 🙈</button></div>
</div>
</section>

<section class="page planPage" id="plan">
<div class="plan">
<div style="text-align:center"><h1>Our Date Plan in Ratlam ❤️</h1><div class="sub">Pickup point + place + actual date + exact time choose karo.</div></div>
<div class="planBox">
<label>🚗 Pickup Point</label><input id="pickup" placeholder="Exact pickup point / landmark">
<label>📍 Date Place</label>
<select id="place">
<option value="">Choose a place...</option>
<optgroup label="☕ Cafés"><option value="7Hills Restaurant &amp; Café, Banjali Bypass Road, Ratlam">7Hills Restaurant &amp; Café, Banjali Bypass Road, Ratlam</option>
<option value="Chai Sutta Bar, Ratlam">Chai Sutta Bar, Ratlam</option>
<option value="Indiana The Cafe, Ratlam">Indiana The Cafe, Ratlam</option>
<option value="Sadda Adda Cafe, Ratlam">Sadda Adda Cafe, Ratlam</option>
<option value="Jalsara, Ratlam">Jalsara, Ratlam</option>
<option value="Checkers Cafe, Ratlam">Checkers Cafe, Ratlam</option>
<option value="The Chai Shala Cafe and Party Zone, Ratlam">The Chai Shala Cafe and Party Zone, Ratlam</option>
<option value="Chahapani, Ram Mandir Road, Jawahar Nagar, Ratlam">Chahapani, Ram Mandir Road, Jawahar Nagar, Ratlam</option>
<option value="Coffee Calling, Do Batti Road, Ratlam">Coffee Calling, Do Batti Road, Ratlam</option>
<option value="Classic Cafe, Ratlam">Classic Cafe, Ratlam</option>
<option value="CSB Hangouts Hub, Ratlam">CSB Hangouts Hub, Ratlam</option></optgroup>
<optgroup label="🛕 Mandir"><option value="Kalika Mata Temple, Ratlam">Kalika Mata Temple, Ratlam</option>
<option value="Mahalakshmi Temple, Manak Chowk, Ratlam">Mahalakshmi Temple, Manak Chowk, Ratlam</option>
<option value="Shri Virupaksh Mahadev Temple, Bilpank, Ratlam">Shri Virupaksh Mahadev Temple, Bilpank, Ratlam</option>
<option value="Bibrod Tirth, Ratlam">Bibrod Tirth, Ratlam</option>
<option value="Shri Nageshwar Parshwanath Tirth, Ratlam">Shri Nageshwar Parshwanath Tirth, Ratlam</option>
<option value="Shri Mehandi Kui Balaji Mandir, Shastri Nagar, Ratlam">Shri Mehandi Kui Balaji Mandir, Shastri Nagar, Ratlam</option>
<option value="Ranjit Hanuman Mandir, Ratlam">Ranjit Hanuman Mandir, Ratlam</option>
<option value="Kaal Bhairav Ji Temple, Ratlam">Kaal Bhairav Ji Temple, Ratlam</option>
<option value="Laxmi Narayan Mandir, Ratlam">Laxmi Narayan Mandir, Ratlam</option>
<option value="Amareshwar Mahadev Mandir, Ratlam">Amareshwar Mahadev Mandir, Ratlam</option>
<option value="Shri Khatu Shyam Mandir, Ratlam">Shri Khatu Shyam Mandir, Ratlam</option>
<option value="Radha Krishna Temple, Ratlam">Radha Krishna Temple, Ratlam</option></optgroup>
<optgroup label="🌿 Other"><option value="Gulab Chakkar, Ratlam">Gulab Chakkar, Ratlam</option>
<option value="Dholawad Dam, Ratlam">Dholawad Dam, Ratlam</option>
<option value="Cactus Garden, Sailana, Ratlam">Cactus Garden, Sailana, Ratlam</option></optgroup>
<option value="Custom location">Other / Custom location</option>
</select>
<div id="customwrap" style="display:none"><label>Exact custom location</label><input id="custom" placeholder="Type exact place"></div>
<div class="mapbox"><iframe id="map" src="https://www.google.com/maps?q=Ratlam%2C%20Madhya%20Pradesh&output=embed"></iframe></div>
<div class="grid2"><div><label>📅 Date</label><input id="date" type="date"></div><div><label>🕒 Time</label><input id="time" type="time"></div></div>
<button class="btn" id="confirm" style="width:100%;margin-top:14px">Confirm Date Plan ❤️</button>
<div class="result" id="result"></div>
<button class="btn" id="share">Send Final Plan on WhatsApp ❤️</button>
</div>
</div>
</section>

<script>
const pages=[...document.querySelectorAll(".page")];
function show(id){pages.forEach(p=>p.classList.toggle("on",p.id===id));window.scrollTo(0,0)}

let code="";
const pin=[...document.querySelectorAll("#pin span")];
function draw(){pin.forEach((p,i)=>p.textContent=i<code.length?"•":"")}
function submit(){
if(code==="2303"){code="";draw();show("special")}
else{code="";draw();show("wrong")}
}
document.getElementById("keys").onclick=e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.a==="back"){code=code.slice(0,-1);draw();return}
if(b.dataset.a==="ok"){submit();return}
if(/^\d$/.test(b.textContent)&&code.length<4){code+=b.textContent;draw();if(code.length===4)setTimeout(submit,180)}
};
document.getElementById("retry").onclick=()=>show("pass");

let origin="special";
document.getElementById("spyes").onclick=()=>show("proposal");
document.getElementById("spno").onclick=()=>{origin="special";document.getElementById("whytext").textContent="Aise kaise 😭";show("whyno")};
document.getElementById("whyretry").onclick=()=>show(origin==="proposal"?"proposal":"special");
document.getElementById("pyes").onclick=()=>show("plan");
document.getElementById("pno").onclick=()=>{origin="proposal";document.getElementById("whytext").textContent="Will you be mine pe bhi NO? 🥺";show("whyno")};

const place=document.getElementById("place"),custom=document.getElementById("custom"),customwrap=document.getElementById("customwrap"),map=document.getElementById("map");
function chosen(){return place.value==="Custom location"?custom.value.trim():place.value}
function mapupdate(){customwrap.style.display=place.value==="Custom location"?"block":"none";map.src="https://www.google.com/maps?q="+encodeURIComponent((chosen()||"Ratlam")+", Madhya Pradesh")+"&output=embed"}
place.onchange=mapupdate;custom.oninput=mapupdate;

const date=document.getElementById("date"),now=new Date(),today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
date.min=today;date.value=today;let msg="";
document.getElementById("confirm").onclick=()=>{
const pu=document.getElementById("pickup").value.trim(),p=chosen(),d=date.value,t=document.getElementById("time").value,res=document.getElementById("result"),share=document.getElementById("share");
res.style.display="block";
if(!pu||!p||!d||!t){res.textContent="🥺 Pickup, place, date aur time sab choose karo.";share.style.display="none";return}
const pd=new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const pt=new Date("2000-01-01T"+t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
msg=`❤️ OUR DATE PLAN ❤️\n🚗 Pickup: ${pu}\n📍 Place: ${p}\n📅 Date: ${pd}\n🕒 Time: ${pt}`;
res.innerHTML=`<b>Plan Confirmed ❤️</b><br>🚗 ${pu}<br>📍 ${p}<br>📅 ${pd}<br>🕒 ${pt}`;
share.style.display="block";
};
document.getElementById("share").onclick=()=>{if(msg)window.open("https://wa.me/916265846172?text="+encodeURIComponent(msg),"_blank")};
</script>
</body>
</html>
